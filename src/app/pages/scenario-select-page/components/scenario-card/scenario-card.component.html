<a (click)="onClick()" class="inline-flex flex-col items-center ">
    <div class="rounded w-32 h-32 color-rect " [class.opacity-0]="this.clicked()"
        [style.background-color]="this.primaryColor()"></div>
    <div class="rounded w-32 h-32 color-rect absolute scale-anim" [class.scale-anim]="this.clicked()"
        [style.background-color]="this.primaryColor()"></div>
    <h2 class="!text-xl !font-bold capitalize !not-italic mt-4 ">{{this.title()}}</h2>
    <h3 class="!text-base capitalize max-w-60 !not-italic text-center text-gray-500">{{this.subtitle()}}</h3>
</a>
