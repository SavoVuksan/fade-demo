<p class="text-gray-500">
    Select a scenario to see how labels and neurons correlate
</p>
<div class="flex flex-row gap-10">
    @for (scenario of store.scenarios(); track $index) {
    <app-scenario-card [id]="scenario.id" [title]="scenario.name" [subtitle]="scenario.description"
        [primaryColor]="scenario.primaryColor"></app-scenario-card>
    }
</div>
