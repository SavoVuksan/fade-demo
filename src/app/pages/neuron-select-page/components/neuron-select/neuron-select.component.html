@for (neuron of this.currentVisibleNeurons(); track $index){
<a [routerLink]="['/','scenario-select',this.store.selectedScenario!()!.id, 'neuron-select', neuron.id]">
    <app-neuron [neuronId]="neuron.id" [layerId]="neuron.layer"
        [state]="this.selectedNeuron() === neuron ? this.neuronState.Selected : $index === 1 ? this.neuronState.Primary : this.neuronState.Secondary"
        (neuronSelect)="onNeuronClick(neuron)"></app-neuron>
</a>
}
