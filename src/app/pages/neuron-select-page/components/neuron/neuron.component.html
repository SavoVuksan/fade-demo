<span class="absolute top-0 mt-1" [class.text-gray-300]="this.state() === neuronState.Secondary"
    [class.text-gray-400]="this.state() === neuronState.Primary || this.state() === neuronState.Selected">{{this.layerId()}}</span>
<span class="text-lg" [class.text-blue-500]="this.state() === neuronState.Selected"
    [class.text-gray-800]="this.state() === neuronState.Primary"
    [class.text-gray-400]="this.state() === neuronState.Secondary">{{this.neuronId()}}</span>
