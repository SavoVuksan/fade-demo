<div class="flex p-2">
    @if(activatedRoute.firstChild?.data | async; as data){
    @if(data['id'] !== 0){
    <a class="button absolute" [routerLink]="['../']" [relativeTo]="activatedRoute.firstChild">Back</a>
    }
    }
    <h1 class="flex-1 text-center !text-2xl text-gray-800">{{activatedRoute.firstChild?.title | async}}</h1>
</div>
